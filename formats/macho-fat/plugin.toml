[[formats]]
name = "Universal binary (64-bit table)"
extension = "dylib"
description = "Mach-O fat binary with 64-bit slice offsets (FAT_MAGIC_64)"
confidence = 100
entry = "FatHeader64"
endian = "be"
detect = [{ offset = 0, hex = "CA FE BA BF" }]
schema = """
// FAT_MAGIC_64 variant: the same slice table with 64-bit offsets and sizes,
// for universal binaries larger than 4 GB.

enum CpuType : i32 {
    Vax       = 1
    Mc680x0   = 6
    X86       = 7
    X86_64    = 0x01000007
    Mc98000   = 10
    Hppa      = 11
    Arm       = 12
    Arm64     = 0x0100000C
    Arm64_32  = 0x0200000C
    Mc88000   = 13
    Sparc     = 14
    I860      = 15
    PowerPC   = 18
    PowerPC64 = 0x01000012
}

struct FatArch64 {
    cputype    CpuType "CPU family of this slice"
    cpusubtype u32     "CPU subtype (bit 31 = lib64; arm64e = 2, x86_64h = 8)"
    offset     u64     "file offset of the slice's Mach-O image"
    size       u64     "slice size in bytes"
    align      u32     "slice alignment as a power of two (14 = 16 KB)"
    reserved   u32
    sliceMagic at offset bytes[4] "Mach-O magic at the slice: CF FA ED FE = 64-bit LE, CE FA ED FE = 32-bit LE"
}

struct FatHeader64 {
    magic    u32                 "0xCAFEBABF"
    nfatArch u32                 "number of architecture slices"
    archs    FatArch64[nfatArch] "one entry per slice"
}
"""
