id = "las"
name = "LAS point cloud"
version = "1.0.0"
description = "ASPRS LAS public header block: point format, scaling, bounding box and the 1.3 / 1.4 additions."
author = "Nybble"

[[formats]]
name = "LAS"
extension = "las"
description = "ASPRS LAS lidar point cloud"
confidence = 93
entry = "Las"
endian = "le"
detect = [{ offset = 0, hex = "4C 41 53 46" }]
schema = """
// LAS - the ASPRS exchange format for lidar, and what a laser scanner or an
// aerial survey delivers. A file is this public header block, then a run of
// variable length records carrying coordinate system and metadata, then the
// point records themselves at offsetToPointData.
//
// Coordinates are stored as 32-bit integers, not floats, which is the central
// design decision: a real coordinate is x * xScaleFactor + xOffset. That keeps
// a billion points compact and their precision uniform across the survey, at
// the cost of every reader having to apply the scaling. A scale of 0.01 with an
// offset near the survey origin is typical, giving centimetre resolution.
//
// pointDataRecordFormat says what each point carries. Formats 0 to 5 are the
// original records; 6 to 10, added in 1.4, widen the return numbers and
// classification and always carry GPS time:
//   0  x, y, z, intensity, return info, classification
//   1  format 0 plus GPS time
//   2  format 0 plus red, green, blue
//   3  format 1 plus colour
//   4  format 1 plus a waveform packet reference
//   5  format 3 plus a waveform packet reference
//   6  the 1.4 base record: wider fields, GPS time always present
//   7  format 6 plus colour        8  format 7 plus near infrared
//   9  format 6 plus waveform      10 format 7 plus waveform and infrared
//
// Version 1.4 also moved the point count. The two legacy fields below are kept
// for old readers and must be zero when a 1.4 file uses the wide point formats;
// the real counts are the 64-bit ones at the end.

bitfield LasGlobalEncoding : u16 {
    gpsTimeIsAdjustedStandard 0 // GPS time is adjusted standard time, not week time
    waveformDataInternal      1 // waveform packets are in this file
    waveformDataExternal      2 // waveform packets are in a .wdp file alongside
    syntheticReturnNumbers    3 // return numbers were generated, not measured
    wkt                       4 // the coordinate system is given as WKT, not GeoTIFF keys
}

struct Las {
    fileSignature      char[4]           "LASF"
    fileSourceId       u16               "flight line number, or 0 when unknown"
    globalEncoding     LasGlobalEncoding "how to read the GPS time and waveform fields"
    projectIdData1     u32               "project GUID, first component"
    projectIdData2     u16               "project GUID, second component"
    projectIdData3     u16               "project GUID, third component"
    projectIdData4     bytes[8]          "project GUID, last eight bytes"
    versionMajor       u8                "1"
    versionMinor       u8                "0 through 4"
    systemIdentifier   string[32]        "the hardware or process that produced the file"
    generatingSoftware string[32]        "the software that wrote it"
    creationDayOfYear  u16               "day of year the file was created, 1 to 366"
    creationYear       u16               "year the file was created"
    headerSize         u16               "bytes of header: 227 for 1.2, 235 for 1.3, 375 for 1.4"
    offsetToPointData  u32               "file offset of the first point record"
    numberOfVlrs       u32               "variable length records between this header and the points"
    pointDataFormat    u8                "which point record layout is used; see the list above"
    pointDataLength    u16               "bytes per point record, including any extra bytes"
    legacyPointCount   u32               "point count for readers older than 1.4; 0 in a 1.4 file using formats 6 to 10"
    legacyPointsByReturn u32[5]          "legacy per-return counts"
    xScaleFactor       f64               "multiply the stored x by this"
    yScaleFactor       f64               "multiply the stored y by this"
    zScaleFactor       f64               "multiply the stored z by this"
    xOffset            f64               "then add this to get real x"
    yOffset            f64               "then add this to get real y"
    zOffset            f64               "then add this to get real z"
    maxX               f64               "bounding box, in real coordinates"
    minX               f64
    maxY               f64
    minY               f64
    maxZ               f64
    minZ               f64
    startOfWaveformData u64 if versionMinor >= 3 "offset of the waveform data packet record, 1.3 and later"
    startOfFirstEvlr   u64 if versionMinor >= 4 "offset of the first extended variable length record"
    numberOfEvlrs      u32 if versionMinor >= 4 "extended variable length records, which may follow the points"
    pointCount         u64 if versionMinor >= 4 "the real point count in a 1.4 file"
    pointsByReturn     u64[15] if versionMinor >= 4 "points per return, up to fifteen returns"
}
"""
